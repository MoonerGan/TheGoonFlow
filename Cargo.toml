[workspace]
resolver = "2"
members = [
    "crates/vault",
    "crates/locator",
    "crates/goon-core",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }

[profile.dev]
opt-level = 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
