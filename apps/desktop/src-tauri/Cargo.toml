[package]
name = "goonflow-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "goonflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "GoonFlow"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["gzip", "json"] }
base64 = "0.22"

goon-core = { path = "../../../crates/goon-core" }
goon-vault = { path = "../../../crates/vault" }
goon-locator = { path = "../../../crates/locator" }
