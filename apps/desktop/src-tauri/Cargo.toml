[package]
name = "goonflow-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "goonflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "GoonFlow"
path = "src/main.rs"

# The exe has to carry its own UI. tauri's own build script sets `dev = !custom_protocol`
# (tauri-2.12.5 build.rs:253), and in `dev` mode the window loads `build.devUrl`
# (http://localhost:1420) instead of the embedded assets - so without this feature a
# `cargo build --release` binary shows WebView2's "can't reach this page /
# ERR_CONNECTION_REFUSED" unless a vite dev server happens to be running. That is what
# tools/verify-artifact.ps1 step 0 now proves, so it can never be silent again.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
# #41: a second launch must reveal the running instance, not fork a second app
# (a hidden instance was unreachable, and the extra copy silently lost the panic
# hotkey because the first one owns it).
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["gzip", "json", "socks"] }
base64 = "0.22"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

goon-core = { path = "../../../crates/goon-core" }
goon-vault = { path = "../../../crates/vault" }
goon-locator = { path = "../../../crates/locator" }
